[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-mcp-server"
version = "0.1.0"
description = "MCP server for arXiv paper search and research management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Sandip Palit" },
]
dependencies = [
    "arxiv>=2.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_mcp_server"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
